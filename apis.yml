apis:
- aid: runpod:rest-api
  name: RunPod REST API
  description: The RunPod REST API programmatically manages Pods, Serverless endpoints, network volumes, templates, container registry auth, and billing. The API is the primary control plane for provisioning and operating GPU compute on RunPod.
  humanURL: https://docs.runpod.io/api-reference/overview
  baseURL: https://rest.runpod.io/v1
  tags:
  - Billing
  - Compute
  - GPU
  - Pods
  - REST
  - Serverless
  - Storage
  - Templates
  properties:
  - type: Documentation
    url: https://docs.runpod.io/api-reference/overview
  - type: OpenAPI
    url: https://rest.runpod.io/v1/openapi.json
- aid: runpod:graphql-api
  name: RunPod GraphQL API
  description: The RunPod GraphQL API provides programmatic access to Pods, templates, and Serverless endpoints via GraphQL queries and mutations. It is the original control-plane interface and is still supported alongside the REST API.
  humanURL: https://docs.runpod.io/sdks/graphql/configurations
  baseURL: https://api.runpod.io/graphql
  tags:
  - Compute
  - GPU
  - GraphQL
  - Pods
  - Serverless
  - Templates
  properties:
  - type: Documentation
    url: https://docs.runpod.io/sdks/graphql/configurations
  - url: graphql/runpod-graphql.md
    type: GraphQL
- aid: runpod:serverless
  name: RunPod Serverless
  description: RunPod Serverless provides pay-as-you-go inference endpoints with autoscaling workers, queue-based and load-balanced endpoint types, FlashBoot cold-start optimization, and per-second billing. Each endpoint exposes a URL that accepts request payloads for AI model inference and compute-intensive workloads.
  humanURL: https://docs.runpod.io/serverless/overview
  baseURL: https://api.runpod.ai/v2
  tags:
  - AI
  - Autoscaling
  - GPU
  - Inference
  - Serverless
  - Workers
  properties:
  - type: Documentation
    url: https://docs.runpod.io/serverless/overview
