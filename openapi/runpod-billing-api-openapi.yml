openapi: 3.1.0
info:
  title: Runpod REST Billing API
  description: 'Runpod REST API for managing GPU pods, serverless endpoints, templates,

    network volumes, container registry credentials, and billing data.

    '
  version: 1.0.0
  contact:
    name: Runpod API Reference
    url: https://docs.runpod.io/api-reference/overview
servers:
- url: https://rest.runpod.io/v1
  description: Runpod REST API production
security:
- bearerAuth: []
tags:
- name: Billing
paths:
  /billing/pods:
    get:
      summary: Retrieve billing data for pods
      operationId: getBillingPods
      responses:
        '200':
          description: Pod billing data
      tags:
      - Billing
  /billing/endpoints:
    get:
      summary: Retrieve billing data for serverless endpoints
      operationId: getBillingEndpoints
      responses:
        '200':
          description: Endpoint billing data
      tags:
      - Billing
  /billing/networkvolumes:
    get:
      summary: Retrieve billing data for network volumes
      operationId: getBillingNetworkVolumes
      responses:
        '200':
          description: Network volume billing data
      tags:
      - Billing
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Runpod API key supplied as a bearer token.
